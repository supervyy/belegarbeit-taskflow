server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:database}:5432/${DB_NAME:taskflow}
spring.datasource.username=${DB_USER:taskflow}
spring.datasource.password=${DB_PASSWORD:geheim123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:5000}

# Allow large request bodies for /api/data tests
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.max-file-size=20MB
server.tomcat.max-http-form-post-size=-1