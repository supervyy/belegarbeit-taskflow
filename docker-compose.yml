services:

  # ─────────────────────────────────────────────
  # REVERSE PROXY  (public entry point, SSL + WAF)
  # ─────────────────────────────────────────────
  reverse-proxy:
    image: owasp/modsecurity-crs:nginx-alpine
    restart: unless-stopped
    environment:
      - MODSEC_RULE_ENGINE=On
      - DOLLAR=$
      - MODSEC_REQ_BODY_LIMIT=20971520
      - MODSEC_REQ_BODY_NOFILES_LIMIT=20971520
      - MODSEC_REQ_BODY_INMEMORY_LIMIT=20971520
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend-1:
        condition: service_healthy
      frontend-2:
        condition: service_healthy
      load-balancer:
        condition: service_healthy
    networks:
      - public-net
      - frontend-net
      - backend-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ─────────────────────────────────────────────
  # LOAD BALANCER  (distributes to backend pool)
  # ─────────────────────────────────────────────
  load-balancer:
    image: nginx:alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-api-1:
        condition: service_healthy
      backend-api-2:
        condition: service_healthy
      backend-api-3:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # ─────────────────────────────────────────────
  # FRONTEND  (2 replicas for HA demo)
  # ─────────────────────────────────────────────
  frontend-1:
    build: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  frontend-2:
    build: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ─────────────────────────────────────────────
  # BACKEND API  (3 instances, Spring Boot)
  # ─────────────────────────────────────────────
  backend-api-1:
    build: ./backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    secrets:
      - db_password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      NOTIFICATION_SERVICE_URL: http://notification-service:5000
    depends_on:
      database:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - backend-net
      - db-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  backend-api-2:
    build: ./backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    secrets:
      - db_password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      NOTIFICATION_SERVICE_URL: http://notification-service:5000
    depends_on:
      database:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - backend-net
      - db-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  backend-api-3:
    build: ./backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    secrets:
      - db_password
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/taskflow
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      NOTIFICATION_SERVICE_URL: http://notification-service:5000
    depends_on:
      database:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - backend-net
      - db-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ─────────────────────────────────────────────
  # NOTIFICATION SERVICE  (Python Flask)
  # ─────────────────────────────────────────────
  notification-service:
    build: ./notification-service
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ─────────────────────────────────────────────
  # DATABASE  (PostgreSQL, db-net isolated)
  # ─────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ─────────────────────────────────────────────
  # DB BACKUP  (hourly pg_dump to volume)
  # ─────────────────────────────────────────────
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      PGHOST: database
      PGDATABASE: taskflow
      PGUSER: taskflow
    volumes:
      - db-backups:/backups
    networks:
      - db-net
    depends_on:
      database:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        while true; do
          export PGPASSWORD=$$(cat /run/secrets/db_password);
          FILENAME=/backups/backup_$$(date +%Y%m%d_%H%M%S).dump;
          pg_dump -Fc -f $$FILENAME && echo \"[backup] Saved $$FILENAME\" || echo \"[backup] FAILED\";
          sleep 3600;
        done
      "
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ─────────────────────────────────────────────
  # MONITORING
  # ─────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    secrets:
      - grafana_password
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:
  public-net:
    driver: bridge
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  db-net:
    driver: bridge
    internal: true   # database can never reach internet
  monitoring-net:
    driver: bridge

# ─────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────
volumes:
  db-data:
  grafana-data:
  prometheus-data:
  uploads-data:
  db-backups:

# ─────────────────────────────────────────────
# DOCKER SECRETS
# ─────────────────────────────────────────────
secrets:
  db_password:
    file: ./.secrets/db_password
  grafana_password:
    file: ./.secrets/grafana_password