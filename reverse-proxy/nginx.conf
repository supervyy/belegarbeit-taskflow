# Rate limiting zone for API endpoints
limit_req_zone ${DOLLAR}binary_remote_addr zone=api_limit:10m rate=10r/s;

# Frontend pool (2 instances for HA)
upstream frontend_pool {
  server frontend-1:80;
  server frontend-2:80;
}

# Load balancer (distributes to backend pool)
upstream load_balancer_upstream {
  server load-balancer:8080;
}

# Grafana
upstream grafana_upstream {
  server grafana:3000;
}

# Prometheus
upstream prometheus_upstream {
  server prometheus:9090;
}

# ─── HTTP: redirect all traffic to HTTPS ───────────────────────────────────
server {
  listen 80;
  server_name _;

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://${DOLLAR}host${DOLLAR}request_uri;
  }
}

# ─── HTTPS main server ─────────────────────────────────────────────────────
server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 10M;

  # ── Frontend ──
  location / {
    proxy_pass         http://frontend_pool;
    proxy_set_header   Host              ${DOLLAR}host;
    proxy_set_header   X-Real-IP         ${DOLLAR}remote_addr;
    proxy_set_header   X-Forwarded-For   ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
  }

  # ── Backend API ──
  location /api/data {
    modsecurity off;
    proxy_request_buffering off;
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://load-balancer:8080/api/data;
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
  }

  # ── API (via load-balancer → backend pool) ──
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass         http://load_balancer_upstream;
    proxy_set_header   Host              ${DOLLAR}host;
    proxy_set_header   X-Real-IP         ${DOLLAR}remote_addr;
    proxy_set_header   X-Forwarded-For   ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
  }

  # ── Health check ──
  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # ── Grafana ──
  location /grafana/ {
    proxy_pass         http://grafana_upstream/;
    proxy_set_header   Host              ${DOLLAR}host;
    proxy_set_header   X-Real-IP         ${DOLLAR}remote_addr;
    proxy_set_header   X-Forwarded-For   ${DOLLAR}proxy_add_x_forwarded_for;
  }

  # ── Prometheus ──
  location /prometheus/ {
    proxy_pass         http://prometheus_upstream/;
    proxy_set_header   Host              ${DOLLAR}host;
    proxy_set_header   X-Real-IP         ${DOLLAR}remote_addr;
    proxy_set_header   X-Forwarded-For   ${DOLLAR}proxy_add_x_forwarded_for;
  }
}