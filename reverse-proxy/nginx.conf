events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Frontend pool (2 instances for HA)
  upstream frontend_pool {
    server frontend-1:80;
    server frontend-2:80;
  }

  # Load balancer (distributes to backend pool)
  upstream load_balancer_upstream {
    server load-balancer:8080;
  }

  # Grafana
  upstream grafana_upstream {
    server grafana:3000;
  }

  # Prometheus
  upstream prometheus_upstream {
    server prometheus:9090;
  }

  # ─── HTTP: redirect all traffic to HTTPS ───────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Health check stays on HTTP (for Docker healthcheck)
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS main server ─────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Allow up to 10 MB bodies (for /api/data load tests)
    client_max_body_size 10M;

    # ── Frontend ──
    location / {
      proxy_pass         http://frontend_pool;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    # ── API (via load-balancer → backend pool) ──
    location /api/ {
      proxy_pass         http://load_balancer_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
      # Increase buffer for large response bodies
      proxy_buffer_size     128k;
      proxy_buffers         4 256k;
    }

    # ── Proxy health endpoint ──
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # ── Grafana (monitoring) ──
    location /grafana/ {
      proxy_pass         http://grafana_upstream/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Prometheus (monitoring) ──
    location /prometheus/ {
      proxy_pass         http://prometheus_upstream/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }
}