global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: backend-api-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-api-1:8080']

  - job_name: backend-api-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-api-2:8080']

  - job_name: backend-api-3
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend-api-3:8080']