global:
  scrape_interval: 2s
  evaluation_interval: 2s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: backend-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'backend-api-1:8080'
          - 'backend-api-2:8080'
          - 'backend-api-3:8080'