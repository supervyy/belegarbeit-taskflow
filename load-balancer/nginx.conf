events {
  worker_connections 4096;
}

http {
  # Backend pool (3 instances, round-robin)
  upstream backend_pool {
    server backend-api-1:8080;
    server backend-api-2:8080;
    server backend-api-3:8080;
  }

  server {
    listen 8080;

    # Allow up to 10 MB bodies (for /api/data load tests)
    client_max_body_size 10M;

    # All API traffic → backend pool
    location / {
      proxy_request_buffering off;
      proxy_pass         http://backend_pool;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
      proxy_next_upstream   error timeout http_502 http_503 http_504;
    }

    # Load balancer health check (does not touch backend)
    location /health {
      return 200 'lb-ok';
      add_header Content-Type text/plain;
    }
  }
}